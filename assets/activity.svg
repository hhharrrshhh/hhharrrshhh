<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120" role="img" aria-labelledby="title desc">
<title id="title">Building and experimenting</title>
<desc id="desc">A subtle animated signal line representing continuous iteration.</desc>
<rect width="1000" height="120" rx="18" fill="#09090b"/>
<rect x="1" y="1" width="998" height="118" rx="18" fill="none" stroke="#27272a"/>
<text x="34" y="43" fill="#71717a" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="3">BUILDING / RESEARCH / ITERATING</text>
<path d="M34 78 H210 L230 78 L248 52 L266 96 L286 66 L306 78 H440 L458 78 L478 58 L496 90 L516 72 L536 78 H700 L720 78 L742 45 L764 101 L786 62 L806 78 H966" fill="none" stroke="#3f3f46" stroke-width="2"/>
<path d="M34 78 H210 L230 78 L248 52 L266 96 L286 66 L306 78 H440 L458 78 L478 58 L496 90 L516 72 L536 78 H700 L720 78 L742 45 L764 101 L786 62 L806 78 H966" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="70 900" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="970" to="0" dur="4.5s" repeatCount="indefinite"/>
</path>
<circle cx="34" cy="78" r="4" fill="#22d3ee">
  <animate attributeName="cx" values="34;966;34" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;.45;1" dur="9s" repeatCount="indefinite"/>
</circle>
</svg>
