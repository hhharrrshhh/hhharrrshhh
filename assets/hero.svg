<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Harsh Gharat — Data Science · AI/ML · Systems</title>
<desc id="desc">Animated dark minimalist hero with orbiting accent lines.</desc>
<defs>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#6366f1" stop-opacity=".28"/>
    <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
    <stop offset=".5" stop-color="#818cf8" stop-opacity=".9"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1200" height="420" rx="28" fill="#09090b"/>
<rect x="1" y="1" width="1198" height="418" rx="28" fill="none" stroke="#27272a"/>
<circle cx="1010" cy="185" r="230" fill="url(#glow)">
  <animate attributeName="r" values="210;245;210" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".75;1;.75" dur="7s" repeatCount="indefinite"/>
</circle>
<g fill="none" stroke="#6366f1" stroke-opacity=".32">
  <ellipse cx="1000" cy="185" rx="215" ry="78" transform="rotate(-18 1000 185)"/>
  <ellipse cx="1000" cy="185" rx="215" ry="78" transform="rotate(42 1000 185)"/>
</g>
<circle cx="1000" cy="185" r="5" fill="#a5b4fc">
  <animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".65;1;.65" dur="2.8s" repeatCount="indefinite"/>
</circle>
<circle cx="0" cy="0" r="4" fill="#22d3ee">
  <animateMotion dur="8s" repeatCount="indefinite" path="M 970 185 C 1100 70 1160 210 1000 270 C 850 330 850 120 1050 105 C 1160 95 1130 280 970 185"/>
</circle>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="70" y="92" fill="#71717a" font-size="15" letter-spacing="4">HARSH GHARAT</text>
  <text x="70" y="166" fill="#fafafa" font-size="58" font-weight="700">Data Science × AI/ML</text>
  <text x="70" y="212" fill="#a1a1aa" font-size="23">Building intelligent systems from data.</text>
  <rect x="70" y="254" width="440" height="58" rx="12" fill="#111113" stroke="#27272a"/>
  <text x="94" y="290" fill="#22d3ee" font-size="16" font-family="monospace">&gt; turn ideas into working things...</text>
  <rect x="365" y="276" width="8" height="18" fill="#a5b4fc">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="70" y="362" fill="#71717a" font-size="14" letter-spacing="2">BUILD · RESEARCH · EXPERIMENT</text>
  <circle cx="55" cy="356" r="4" fill="#22d3ee">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
  </circle>
</g>
<line x1="70" y1="334" x2="1130" y2="334" stroke="url(#line)" stroke-width="1">
  <animate attributeName="x1" values="70;150;70" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="x2" values="1130;1050;1130" dur="6s" repeatCount="indefinite"/>
</line>
</svg>
